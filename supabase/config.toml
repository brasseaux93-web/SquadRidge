# Local Supabase CLI configuration for SquadRidge.
# Start: npx supabase start
# Reset + migrate + seed: npx supabase db reset

project_id = "squadridge-local"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
